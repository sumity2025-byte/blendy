:root{
  --n: clamp(0.5px, min(calc(100vw / 1440), calc(100vh / 900)), 1.3px);
  --u: 1px;
  --fy: 0px;
  --hdr-x: calc(50 * var(--n));
  --hdr-y: calc(26 * var(--n));
  --hdr-h: calc(50 * var(--n));
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;
  background:#C2B0DC;
  color:#fff;
  font-family:Poppins,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
a{color:#fff;text-decoration:none}
button{font:inherit;color:#fff;background:none;border:0;padding:0;cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- stage + slides ---------- */
.stage{position:fixed;inset:0;overflow:hidden;opacity:0}
html.is-ready .stage{opacity:1;transition:opacity .01s linear}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:0}
.slide.is-under{visibility:visible;z-index:1}
.slide.is-current{visibility:visible;z-index:2}
.frame{
  position:absolute;
  left:50%;
  top:50%;
  width:calc(1440 * var(--u));
  height:calc(900 * var(--u));
  margin-left:calc(-720 * var(--u));
  margin-top:calc(-450 * var(--u) + var(--fy));
}
.layer{position:absolute;inset:0;will-change:transform}

/* ---------- word ---------- */
.word{
  position:absolute;
  left:0;right:0;
  text-align:center;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
  color:#fff;
  visibility:hidden;
}
html.is-ready .word{visibility:visible}

/* ---------- floor shadows ---------- */
.shadow-layer i{
  position:absolute;
  display:block;
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(60,40,80,.22), transparent);
  filter:blur(calc(4 * var(--u)));
}

/* ---------- cut-out crops ---------- */
.piece{position:absolute}
.piece>i{
  display:block;
  width:100%;
  height:100%;
  background-repeat:no-repeat;
  animation-name:bob;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
}
.piece.bottle>i{animation:none}
@keyframes bob{
  from{transform:translateY(calc(-7 * var(--u))) rotate(calc(var(--base) - 3deg))}
  to{transform:translateY(calc(7 * var(--u))) rotate(calc(var(--base) + 3deg))}
}

/* ---------- fixed UI ---------- */
.ui{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  text-shadow:0 1px 6px rgba(90,70,40,.18);
}
.ui a,.ui button{pointer-events:auto}
[data-rise]{opacity:0;translate:0 14px}
html.is-ready [data-rise]{
  opacity:1;
  translate:0 0;
  transition:opacity 1000ms cubic-bezier(.22,.8,.3,1) var(--d,0ms),
             translate 1000ms cubic-bezier(.22,.8,.3,1) var(--d,0ms);
}
html.reduced [data-rise]{opacity:1;translate:0 0;transition:none}

.hdr{
  position:absolute;
  left:var(--hdr-x);
  right:var(--hdr-x);
  top:var(--hdr-y);
  height:var(--hdr-h);
  display:flex;
  align-items:center;
}
.logo{
  font-family:'Baloo 2',Poppins,sans-serif;
  font-weight:800;
  font-size:calc(51 * var(--n));
  letter-spacing:-.02em;
  line-height:1;
}
.account{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:calc(22 * var(--n));
  font-weight:500;
  font-size:calc(21 * var(--n));
}
.account .sep{opacity:.9}

/* tabs */
.tabs{
  position:absolute;
  left:50%;
  top:calc(var(--hdr-y) + var(--hdr-h) / 2);
  transform:translate(-50%,-50%);
  display:flex;
  gap:calc(88 * var(--n));
  font-weight:500;
  font-size:calc(21 * var(--n));
  white-space:nowrap;
}
.tabs button{
  padding:calc(6 * var(--n)) 0;
  opacity:1;
}
.underline{
  position:absolute;
  left:0;
  top:calc(100% + 2 * var(--n));
  height:2px;
  width:0;
  border-radius:2px;
  background:#fff;
  transform:translateX(0);
  transition:transform .6s cubic-bezier(.65,0,.35,1), width .6s cubic-bezier(.65,0,.35,1);
}
html.reduced .underline{transition:none}

/* bottom controls */
.shop{
  position:absolute;
  left:50%;
  bottom:calc(36 * var(--n));
  transform:translateX(-50%);
  font-weight:600;
  font-size:calc(21 * var(--n));
  letter-spacing:.2em;
  padding:calc(10 * var(--n)) calc(16 * var(--n));
  white-space:nowrap;
}
.arrow{
  position:absolute;
  bottom:calc(30 * var(--n));
  width:calc(52 * var(--n));
  height:calc(52 * var(--n));
  display:grid;
  place-items:center;
}
.arrow svg{width:calc(28 * var(--n));height:calc(28 * var(--n));display:block}
.arrow.prev{left:calc(36 * var(--n))}
.arrow.next{right:calc(36 * var(--n))}

/* ---------- tablet / mobile ---------- */
@media (max-width:820px),(orientation:portrait){
  :root{
    --n:1px;
    --hdr-x:20px;
    --hdr-y:16px;
    --hdr-h:40px;
  }
  .logo{font-size:34px}
  .account{font-size:15px;gap:10px}
  .tabs{top:52px;transform:translateX(-50%);gap:22px;font-size:15px}
  .underline{top:calc(100% + 2px)}
  .shop{font-size:15px;bottom:22px;padding:4px 6px}
  .arrow{width:48px;height:48px;bottom:12px}
  .arrow svg{width:24px;height:24px}
  .arrow.prev{left:8px}
  .arrow.next{right:8px}
}

@media (prefers-reduced-motion:reduce){
  .piece>i{animation:none;transform:rotate(var(--base))}
  .underline{transition:none}
}
</style>
</head>
<body>

<div class="stage" id="stage" aria-label="Blendy flavour showcase"></div>

<div class="ui">
  <header class="hdr">
    <a class="logo" href="#" data-rise style="--d:250ms">Blendy</a>
    <div class="account" data-rise style="--d:410ms">
      <a href="#">Cart</a>
      <span class="sep" aria-hidden="true">|</span>
      <a href="#">Register</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Flavours" data-rise style="--d:330ms"></nav>

  <a class="shop" href="#" data-rise style="--d:570ms">SHOP NOW</a>

  <button class="arrow prev" data-rise style="--d:490ms" aria-label="Previous flavour">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M24 14H4"/><path d="M12 6l-8 8 8 8"/>
    </svg>
  </button>
  <button class="arrow next" data-rise style="--d:650ms" aria-label="Next flavour">
    <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 14h20"/><path d="M16 6l8 8-8 8"/>
    </svg>
  </button>
</div>

<script>
(function(){
  'use strict';

  var PROXY = 'https://images.higgs.ai/?default=1&output=webp&w=2048&q=85&url=';
  var CDN = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
  function sheet(file){ return PROXY + encodeURIComponent(CDN + file); }

  var FLAVOURS = [
    {
      id:'berry', name:'Berry', bg:'#C2B0DC',
      src:sheet('hf_20261117_053958_8803e421-29b1-4c24-8efd-54cae3f479b4.png'),
      items:[[233,60,598,917],[1209,272,569,573],[265,1230,579,572],[1192,1192,626,641]],
      bottle:{x:518,y:138,w:372},
      pieces:[
        {item:2,x:383, y:178,w:104,rot:0,  mirror:false,layer:'fruit'},
        {item:3,x:960, y:232,w:118,rot:0,  mirror:false,layer:'fruit'},
        {item:1,x:295, y:478,w:129,rot:-8, mirror:false,layer:'fruit'},
        {item:1,x:1247,y:455,w:123,rot:15, mirror:false,layer:'fruit'},
        {item:2,x:968, y:590,w:110,rot:30, mirror:false,layer:'fruit'},
        {item:1,x:-15, y:590,w:255,rot:0,  mirror:false,layer:'corner'},
        {item:3,x:1282,y:40, w:200,rot:0,  mirror:false,layer:'corner'}
      ]
    },
    {
      id:'kiwi', name:'Kiwi', bg:'#B4D58A',
      src:sheet('hf_20261117_053958_b5695e60-72da-4b5b-bfb7-a091d528af75.png'),
      items:[[217,90,610,874],[1204,257,619,601],[250,1197,619,522],[1200,1186,633,650]],
      bottle:{x:504,y:135,w:403},
      pieces:[
        {item:2,x:376, y:170,w:144,rot:-150,mirror:true, layer:'fruit'},
        {item:3,x:960, y:228,w:152,rot:0,   mirror:false,layer:'fruit'},
        {item:1,x:303, y:460,w:168,rot:0,   mirror:false,layer:'fruit'},
        {item:2,x:1187,y:462,w:148,rot:-25, mirror:false,layer:'fruit'},
        {item:2,x:946, y:606,w:150,rot:10,  mirror:true, layer:'fruit'},
        {item:1,x:-10, y:575,w:260,rot:0,   mirror:false,layer:'corner'},
        {item:3,x:1285,y:30, w:200,rot:0,   mirror:false,layer:'corner'}
      ]
    },
    {
      id:'banana', name:'Banana', bg:'#F3DA8A',
      src:sheet('hf_20261117_053958_6cf14029-4bce-4c9a-b9fc-1c5b185082e3.png'),
      items:[[194,76,579,873],[1205,228,596,597],[230,1181,624,648],[1193,1182,646,659]],
      bottle:{x:512,y:135,w:383},
      pieces:[
        {item:1,x:387, y:147,w:123,rot:0,  mirror:false,layer:'fruit'},
        {item:2,x:970, y:223,w:136,rot:-10,mirror:true, layer:'fruit'},
        {item:3,x:298, y:483,w:132,rot:15, mirror:false,layer:'fruit'},
        {item:2,x:1245,y:462,w:150,rot:20, mirror:false,layer:'fruit'},
        {item:3,x:950, y:582,w:130,rot:-12,mirror:false,layer:'fruit'},
        {item:3,x:0,   y:585,w:235,rot:0,  mirror:false,layer:'corner'},
        {item:1,x:1280,y:30, w:190,rot:0,  mirror:false,layer:'corner'}
      ]
    },
    {
      id:'strawberry', name:'Strawberry', bg:'#F2AFC0',
      src:sheet('hf_20261117_055135_cbfb5a8d-c52b-4358-a6ee-d941c6c42285.png'),
      items:[[226,88,594,887],[1190,216,561,653],[257,1168,604,662],[1240,1169,632,686]],
      bottle:{x:512,y:135,w:386},
      pieces:[
        {item:1,x:372, y:142,w:128,rot:0,  mirror:false,layer:'fruit'},
        {item:2,x:955, y:225,w:117,rot:20, mirror:false,layer:'fruit'},
        {item:3,x:290, y:455,w:140,rot:-10,mirror:false,layer:'fruit'},
        {item:3,x:1250,y:432,w:135,rot:15, mirror:false,layer:'fruit'},
        {item:2,x:962, y:558,w:146,rot:-15,mirror:false,layer:'fruit'},
        {item:1,x:-10, y:555,w:245,rot:0,  mirror:false,layer:'corner'},
        {item:1,x:1285,y:35, w:200,rot:20, mirror:false,layer:'corner'}
      ]
    }
  ];

  var SHADOWS = [[345,650,170,24],[720,708,320,30],[1318,638,160,22],[1045,760,150,22]];
  var FACTORS = { word:0.40, shadow:0.30, bottle:0.15, fruit:0.55, corner:0.75 };
  var DURATION = 970;

  /* ---------- scale ---------- */
  var U = 1, MOBILE = false;

  function px(n){ return 'calc(' + (Math.round(n * 1000) / 1000) + ' * var(--u))'; }

  function measureScale(){
    var vw = window.innerWidth, vh = window.innerHeight;
    MOBILE = vw <= 820 || vh > vw;
    var u;
    if (MOBILE){
      u = Math.min(vw / 640, (vh - 200) / 620);
      document.documentElement.style.setProperty('--fy', '8px');
    } else {
      u = Math.min(vw / 1440, vh / 900);
      document.documentElement.style.setProperty('--fy', '0px');
    }
    U = Math.max(u, 0.02);
    document.documentElement.style.setProperty('--u', U + 'px');
    return U * 1440;
  }

  /* ---------- DOM build ---------- */
  var stage = document.getElementById('stage');
  var tabsEl = document.getElementById('tabs');
  var underline = document.createElement('span');
  underline.className = 'underline';

  function crop(el, src, box, W){
    var bx = box[0], by = box[1], bw = box[2], bh = box[3];
    var s = W / bw;
    el.style.backgroundImage = 'url("' + src + '")';
    el.style.backgroundSize = px(2048 * s) + ' ' + px(2048 * s);
    el.style.backgroundPosition = px(-bx * s) + ' ' + px(-by * s);
  }

  function pieceEl(flavour, spec){
    var box = flavour.items[spec.item];
    var bw = box[2], bh = box[3];
    var s = spec.w / bw;
    var outer = document.createElement('div');
    outer.className = 'piece' + (spec.layer === 'corner' ? ' corner' : '');
    outer.style.left = px(spec.x);
    outer.style.top = px(spec.y);
    outer.style.width = px(spec.w);
    outer.style.height = px(bh * s);
    if (spec.mirror) outer.style.transform = 'scaleX(-1)';
    if (spec.layer === 'corner') outer.style.filter = 'blur(calc(9 * var(--u)))';
    var inner = document.createElement('i');
    crop(inner, flavour.src, box, spec.w);
    inner.style.setProperty('--base', spec.rot + 'deg');
    inner.style.animationDuration = (3.2 + Math.random() * 1.8).toFixed(2) + 's';
    inner.style.animationDelay = (-Math.random() * 4).toFixed(2) + 's';
    outer.appendChild(inner);
    return outer;
  }

  var slides = [];

  FLAVOURS.forEach(function(flavour, index){
    var section = document.createElement('section');
    section.className = 'slide' + (index === 0 ? ' is-current' : '');
    section.style.background = flavour.bg;
    section.setAttribute('aria-label', flavour.name);

    var frame = document.createElement('div');
    frame.className = 'frame';

    var wordLayer = document.createElement('div');
    wordLayer.className = 'layer word-layer';
    var word = document.createElement('span');
    word.className = 'word';
    word.textContent = flavour.name;
    wordLayer.appendChild(word);

    var shadowLayer = document.createElement('div');
    shadowLayer.className = 'layer shadow-layer';
    SHADOWS.forEach(function(s){
      var d = document.createElement('i');
      d.style.left = px(s[0] - s[2] / 2);
      d.style.top = px(s[1] - s[3] / 2);
      d.style.width = px(s[2]);
      d.style.height = px(s[3]);
      shadowLayer.appendChild(d);
    });

    var bottleLayer = document.createElement('div');
    bottleLayer.className = 'layer bottle-layer';
    var bottle = document.createElement('div');
    bottle.className = 'piece bottle';
    var box = flavour.items[0], bs = flavour.bottle.w / box[2];
    bottle.style.left = px(flavour.bottle.x);
    bottle.style.top = px(flavour.bottle.y);
    bottle.style.width = px(flavour.bottle.w);
    bottle.style.height = px(box[3] * bs);
    var bottleInner = document.createElement('i');
    crop(bottleInner, flavour.src, box, flavour.bottle.w);
    bottle.appendChild(bottleInner);
    bottleLayer.appendChild(bottle);

    var fruitLayer = document.createElement('div');
    fruitLayer.className = 'layer fruit-layer';
    var cornerLayer = document.createElement('div');
    cornerLayer.className = 'layer corner-layer';

    flavour.pieces.forEach(function(spec){
      var el = pieceEl(flavour, spec);
      (spec.layer === 'corner' ? cornerLayer : fruitLayer).appendChild(el);
    });

    frame.appendChild(wordLayer);
    frame.appendChild(shadowLayer);
    frame.appendChild(bottleLayer);
    frame.appendChild(fruitLayer);
    frame.appendChild(cornerLayer);
    section.appendChild(frame);
    stage.appendChild(section);

    slides.push({
      section: section,
      name: flavour.name,
      word: word,
      layers: {
        word: wordLayer,
        shadow: shadowLayer,
        bottle: bottleLayer,
        fruit: fruitLayer,
        corner: cornerLayer
      }
    });

    var tab = document.createElement('button');
    tab.type = 'button';
    tab.textContent = flavour.name;
    if (index === 0) tab.setAttribute('aria-current', 'true');
    tab.addEventListener('click', function(event){
      event.stopPropagation();
      touch();
      goTo(index, index > current ? 1 : -1);
    });
    tabsEl.appendChild(tab);
  });

  tabsEl.appendChild(underline);

  var tabs = Array.prototype.slice.call(tabsEl.querySelectorAll('button'));

  /* ---------- word fitting ---------- */
  var measureCanvas = document.createElement('canvas');
  var mctx = measureCanvas.getContext('2d');
  var supportsTracking = 'letterSpacing' in mctx;

  function inkOf(text, tracking){
    mctx.font = '700 100px Poppins, system-ui, sans-serif';
    if (supportsTracking) mctx.letterSpacing = tracking;
    var m = mctx.measureText(text);
    return m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  }

  function fitWord(text){
    var wide = inkOf(text, '0.5px') || 1;
    var tight = inkOf(text, '-3.5px') || 1;
    var isLong = wide * 4.45 > 1330;
    var F, ls;
    if (MOBILE){
      var visible = Math.min(1440, window.innerWidth / U) * 0.92;
      F = isLong ? visible / (tight / 100) : visible / (wide / 100);
      ls = isLong ? '-0.035em' : '0.005em';
    } else if (isLong){
      F = Math.min(445, 1400 / (tight / 100));
      ls = '-0.035em';
    } else {
      F = 445;
      ls = '0.005em';
    }
    var baseline = 403.5 + 0.698 * F / 2;
    return { size: F, tracking: ls, top: baseline - 0.85 * F };
  }

  function layoutWords(){
    slides.forEach(function(slide){
      var fit = fitWord(slide.name);
      slide.word.style.fontSize = px(fit.size);
      slide.word.style.letterSpacing = fit.tracking;
      slide.word.style.top = px(fit.top);
    });
  }

  /* ---------- underline ---------- */
  function moveUnderline(index, instant){
    var tab = tabs[index];
    if (!tab) return;
    if (instant) underline.style.transition = 'none';
    underline.style.width = tab.offsetWidth + 'px';
    underline.style.transform = 'translateX(' + tab.offsetLeft + 'px)';
    if (instant){
      void underline.offsetWidth;
      underline.style.transition = '';
    }
    tabs.forEach(function(t, i){
      if (i === index) t.setAttribute('aria-current', 'true');
      else t.removeAttribute('aria-current');
    });
  }

  /* ---------- transition curve ---------- */
  var COVER_T = [0,0.031,0.134,0.206,0.278,0.34,0.412,0.485,0.546,0.583,0.62,0.69,0.79,0.85,0.93,1];
  var COVER_C = [0,0.006,0.012,0.023,0.047,0.07,0.105,0.158,0.246,0.55,0.825,0.9,0.94,0.956,0.975,1];

  function cover(t){
    for (var i = 0; i < COVER_T.length - 1; i++){
      if (t <= COVER_T[i + 1]){
        var span = COVER_T[i + 1] - COVER_T[i];
        var k = span === 0 ? 0 : (t - COVER_T[i]) / span;
        return COVER_C[i] + (COVER_C[i + 1] - COVER_C[i]) * (k * k * (3 - 2 * k));
      }
    }
    return 1;
  }

  function easeOutQuad(x){ return 1 - (1 - x) * (1 - x); }

  function layerKeys(slide){ return ['word','shadow','bottle','fruit','corner']; }

  function setLayers(slide, x){
    layerKeys(slide).forEach(function(key){
      slide.layers[key].style.transform = 'translateX(' + x + 'px)';
    });
  }

  function clearLayers(slide){
    layerKeys(slide).forEach(function(key){
      slide.layers[key].style.transform = '';
    });
    slide.section.style.clipPath = '';
  }

  /* ---------- flavour change ---------- */
  var current = 0;
  var animating = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.documentElement.classList.add('reduced');

  function swap(next){
    slides.forEach(function(slide, i){
      slide.section.classList.toggle('is-current', i === next);
      slide.section.classList.remove('is-under');
      slide.section.style.clipPath = '';
      layerKeys(slide).forEach(function(key){ slide.layers[key].style.transform = ''; });
    });
    current = next;
    moveUnderline(next, reduced);
  }

  function cancelAnimations(slide){
    layerKeys(slide).forEach(function(key){
      var el = slide.layers[key];
      if (el.getAnimations) el.getAnimations().forEach(function(a){ a.cancel(); });
    });
  }

  function goTo(next, dir){
    if (next === current || animating) return;
    moveUnderline(next, reduced);
    if (reduced){ swap(next); return; }

    animating = true;
    var out = slides[current];
    var incoming = slides[next];
    var width = 1440 * U;

    cancelAnimations(out);
    cancelAnimations(incoming);
    incoming.section.classList.add('is-under');

    var start = performance.now();

    function frame(now){
      var t = Math.min((now - start) / DURATION, 1);
      var c = cover(t);

      out.section.style.clipPath = dir > 0
        ? 'inset(0 ' + (c * 100) + '% 0 0)'
        : 'inset(0 0 0 ' + (c * 100) + '%)';
      setLayers(out, -dir * c * 0.14 * width);

      var k = easeOutQuad(Math.max(0, Math.min(1, (t - 0.5) / 0.42)));
      layerKeys(incoming).forEach(function(key){
        var offset = dir * (1 - k) * FACTORS[key] * width;
        incoming.layers[key].style.transform = 'translateX(' + offset + 'px)';
      });

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        out.section.classList.remove('is-current');
        out.section.style.clipPath = '';
        layerKeys(out).forEach(function(key){ out.layers[key].style.transform = ''; });
        incoming.section.classList.remove('is-under');
        incoming.section.classList.add('is-current');
        layerKeys(incoming).forEach(function(key){ incoming.layers[key].style.transform = ''; });
        current = next;
        animating = false;
      }
    }
    requestAnimationFrame(frame);
  }

  function next(){ goTo((current + 1) % FLAVOURS.length, 1); }
  function prev(){ goTo((current - 1 + FLAVOURS.length) % FLAVOURS.length, -1); }

  /* ---------- interaction ---------- */
  var lastAction = -1e9;
  function touch(){ lastAction = performance.now(); }

  document.querySelectorAll('.arrow.prev').forEach(function(b){
    b.addEventListener('click', function(){ touch(); prev(); });
  });
  document.querySelectorAll('.arrow.next').forEach(function(b){
    b.addEventListener('click', function(){ touch(); next(); });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'){ touch(); prev(); }
    else if (e.key === 'ArrowRight'){ touch(); next(); }
  });

  var startX = null, startY = null;
  stage.addEventListener('pointerdown', function(e){
    startX = e.clientX; startY = e.clientY;
  });
  window.addEventListener('pointerup', function(e){
    if (startX === null) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    startX = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)){
      touch();
      if (dx < 0) next(); else prev();
    }
  });

  setInterval(function(){
    if (document.hidden) return;
    if (performance.now() - lastAction < 6000) return;
    next();
  }, 2600);

  /* ---------- opening ---------- */
  var booted = false;

  function boot(){
    if (booted) return;
    booted = true;
    measureScale();
    layoutWords();
    moveUnderline(current, true);

    document.documentElement.classList.add('is-ready');

    if (reduced) return;

    var width = 1440 * U;
    var ease = 'cubic-bezier(.22,.8,.3,1)';
    layerKeys(slides[0]).forEach(function(key){
      slides[0].layers[key].animate(
        [
          { transform: 'translateX(' + (FACTORS[key] * width) + 'px)' },
          { transform: 'translateX(0px)' }
        ],
        { duration: 900, easing: ease, fill: 'none' }
      );
    });
  }

  window.addEventListener('resize', function(){
    measureScale();
    layoutWords();
    moveUnderline(current, true);
  });

  var fonts = ('fonts' in document)
    ? document.fonts.load('700 100px Poppins')
        .then(function(){ return document.fonts.load('500 20px Poppins'); })
        .then(function(){ return document.fonts.load('600 20px Poppins'); })
        .then(function(){ return document.fonts.load('800 20px "Baloo 2"'); })
        .then(function(){ return document.fonts.ready; })
    : Promise.resolve();

  fonts.then(boot, boot);
  setTimeout(boot, 3000);
})();
</script>
